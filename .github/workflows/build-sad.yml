name: GIBox sad
on: [workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Rename package label icon
        run: |
          sed -i 's|applicationId = "com.gibox.tool"|applicationId = "com.gibox.tool.v18"|' app/build.gradle.kts
          sed -i 's|com.gibox.tool.documents|com.gibox.tool.v18.documents|g' app/src/main/AndroidManifest.xml app/src/main/java/com/gibox/tool/DirectoryProvider.java
          mkdir -p app/src/main/res/drawable
          base64 -d <<'B64' > app/src/main/res/drawable/ic_sad.jpg

B64
          python3 - <<'PY'
          p = 'app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:label="GIBox"', 'android:label="悲伤小璘"')
          s = s.replace('<application ', '<application android:icon="@drawable/ic_sad" ', 1)
          open(p, 'w').write(s)
          PY
          grep -n 'android:icon\|android:label' app/src/main/AndroidManifest.xml
      - run: gradle --no-daemon :app:assembleDebug
      - name: Collect
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/GIBox-1.0.18-sad.apk"
          echo "APK=$RUNNER_TEMP/GIBox-1.0.18-sad.apk" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create sad "$APK" --title "temp" --notes "temp"

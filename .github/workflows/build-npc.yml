name: GIBox npc
on: [workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Patch lod and npc and rename
        run: |
          sed -i 's|applicationId = "com.gibox.tool"|applicationId = "com.gibox.tool.v18"|' app/build.gradle.kts
          sed -i 's|com.gibox.tool.documents|com.gibox.tool.v18.documents|g' app/src/main/AndroidManifest.xml app/src/main/java/com/gibox/tool/DirectoryProvider.java
          python3 - <<'PY'
          p='app/src/main/cpp/runtime.cpp'
          s=open(p).read()
          a='  std::set<Ptr> renderers;for(auto& kv:attachments)if(alive(kv.first))renderers.insert(kv.first);\n  bool mine=false;for(auto* m:wanted)mine=mine||(ch.entity&&m->id==ch.config);\n  if(mine)try{for(Ptr r:worldRenderers())if(alive(r))renderers.insert(r);}catch(const std::exception&){}\n'
          add='  std::set<unsigned> wantedIds;for(auto* m:wanted)if(m->id)wantedIds.insert(m->id);\n  if(!wantedIds.empty()&&ctl.npcModels)try{\n   for(Ptr r:sceneRenderers(now)){if(!alive(r))continue;auto a=npcSource(r);if(a.empty()||a=="?")continue;\n    unsigned id=previewId(a);if(id&&wantedIds.count(id))renderers.insert(r);}\n  }catch(const std::exception&){}\n'
          assert a in s
          s=s.replace(a,a+add,1)
          old=' std::string npcSource(Ptr r){auto owner=npcOwner(r);if(owner.empty())return {};if(!bonePolicy)return "?";\n  auto it=bonePolicy->npcs.find(owner);return it==bonePolicy->npcs.end()?"?":it->second;}'
          new=' std::string npcSource(Ptr r){auto owner=npcOwner(r);if(owner.empty())return {};if(!bonePolicy)return "?";\n  auto it=bonePolicy->npcs.find(owner);if(it!=bonePolicy->npcs.end())return it->second;\n  if(owner.rfind("npc_",0)==0){auto rest=owner.substr(4);std::vector<std::string> parts;size_t p=0;\n   while(p<=rest.size()&&parts.size()<8){auto q=rest.find("_",p);parts.push_back(rest.substr(p,q==std::string::npos?std::string::npos:q-p));if(q==std::string::npos)break;p=q+1;}\n   if(parts.size()>=4&&parts[0]=="avatar")return parts[0]+"_"+parts[1]+"_"+parts[2]+"_"+parts[3];}\n  return "?";}'
          assert old in s
          s=s.replace(old,new,1)
          open(p,'w').write(s)
          m='app/src/main/AndroidManifest.xml'
          t=open(m).read()
          t=t.replace('android:label="GIBox"','android:label="悲伤小璘"')
          t=t.replace('<application ','<application android:icon="@drawable/ic_sad" ',1)
          open(m,'w').write(t)
          print("patched")
          PY
      - run: gradle --no-daemon :app:assembleDebug
      - name: Collect
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/GIBox-npc.apk"
          echo "APK=$RUNNER_TEMP/GIBox-npc.apk" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create sadnpc "$APK" --title "temp" --notes "temp"
